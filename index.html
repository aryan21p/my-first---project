<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tic Tac Toe | Aryan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <h1 class="title">Tic Tac Toe</h1>

  <!-- SVG Decoration -->
  <div class="svg-decor">
    <svg width="80" height="80" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" stroke="#6366f1" stroke-width="6" fill="none" />
      <line x1="30" y1="30" x2="70" y2="70" stroke="#ef4444" stroke-width="6"/>
      <line x1="70" y1="30" x2="30" y2="70" stroke="#ef4444" stroke-width="6"/>
    </svg>
  </div>

  <div class="game">
    <div class="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <p id="status"></p>
    <button id="restart">Restart Game</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
